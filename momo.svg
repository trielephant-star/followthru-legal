<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Momo the sloth">
  <style>
    .momo-lid { transform-box: fill-box; transform-origin: top; transform: scaleY(0); animation: momo-blink 6s infinite; }
    @keyframes momo-blink { 0%, 94%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
    .momo-wave { transform-box: view-box; transform-origin: 130px 138px; animation: momo-wave 7s ease-in-out 1.2s infinite; }
    @keyframes momo-wave { 0%, 30%, 100% { transform: rotate(0); } 6%, 14%, 22% { transform: rotate(-120deg); } 10%, 18% { transform: rotate(-95deg); } }
    @media (prefers-reduced-motion: reduce) { .momo-lid, .momo-wave { animation: none; } }
  </style>
